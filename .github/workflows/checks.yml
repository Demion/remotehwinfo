name: Checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: index.html / 404.html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check of inline script
        run: |
          node -e "
          const s = require('fs').readFileSync('index.html', 'utf8');
          const m = s.match(/<script>([\s\S]*)<\/script>/);
          if (!m) { console.error('no script found'); process.exit(1); }
          new Function(m[1]);
          console.log('inline script OK');
          "

  static-analysis:
    name: cppcheck
    runs-on: ubuntu-latest
    continue-on-error: true  # advisory, Windows-only code is only approximated here
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: >
          cppcheck --enable=warning,performance,portability --inline-suppr
          --std=c++14 --platform=win64 --error-exitcode=1
          --suppress=missingInclude --suppress=unusedStructMember
          -D_WIN32 -D_MSC_VER=1930
          Source/main.cpp
