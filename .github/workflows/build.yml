name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.configuration }} | ${{ matrix.platform }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [x64, Win32]
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: >
          msbuild remotehwinfo.sln
          /m
          /p:Configuration=${{ matrix.configuration }}
          /p:Platform=${{ matrix.platform }}
          /p:TreatWarningsAsErrors=false
          /v:minimal

      - name: Collect files
        shell: pwsh
        run: |
          $out = "dist"
          New-Item -ItemType Directory -Force $out | Out-Null
          $exe = Get-ChildItem -Recurse -Filter remotehwinfo.exe |
            Where-Object { $_.FullName -match [regex]::Escape("${{ matrix.configuration }}") } |
            Select-Object -First 1
          if (-not $exe) { throw "remotehwinfo.exe not found" }
          Copy-Item $exe.FullName $out
          Copy-Item index.html, 404.html $out

      - uses: actions/upload-artifact@v4
        with:
          name: RemoteHWInfo-${{ matrix.configuration }}-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: RemoteHWInfo-Release-*
          path: artifacts

      - name: Zip
        run: |
          cd artifacts
          for d in */; do (cd "$d" && zip -r "../${d%/}_${GITHUB_REF_NAME}.zip" .); done

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
