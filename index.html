<html>
	<head>
		<title>RemoteHWInfo</title>
		<link rel="shortcut icon" href="data:image/x-icon;base64,AAABAAEAEBAQAAEABAAoAQAAFgAAACgAAAAQAAAAIAAAAAEABAAAAAAAgAAAAAAAAAAAAAAAEAAAAAAAAADy8vIAFxcXAP7+/gC/hBcAvoQWAP///wC/hRcAvoUWAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAEREREREREREREREREREREREREBIRIRERERFVFVFVEREREVUVUVURERERVRVRVRERERFVFVFVEREREREREREREWZmVWVWZWZmZmZVZVZVZmZmdlVlVmZmZmZ2VWVWZmZmZnZVZVZmZmY2ZyJmZmZmZnRmZmZmZmZmZjZmZmZmZmYAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" />
		<style>
			body {
				font-family: "JetBrains Mono",monospace;
			}

			table {
				width: 100%;
				border-collapse: collapse;
				background-color: #222;
				color: #fff;
			}

			thead {
				background-color: #444;
				color: #fff;
				padding: 10px;
				text-align: left;
			}

			thead td {
				font-size: 20px;
			}

			td {
				padding: 10px;
				border-bottom: 1px solid #555;
				font-size: 14px;
			}

			#category td{
				background-color: #333;
				font-size: 17px;
			}

			thead tr:hover {
				background-color: #444 !important;
				color: #fff !important;
				font-size: 20px;
			}

			tr:hover:not(#category) {
				background-color: #999;
				color: #000;
				font-size: 14.5px;
				font-weight: bold;
			}

			#checkboxContainer {
				position: absolute;
				left: 50%;
				transform: translate(-50%);
			}
		</style>
	</head>
	<body>
		<div id="hwinfo"></div>
		<div id="gpuz"></div>
		<div id="afterburner"></div>
		<div id="checkboxContainer"><input type="checkbox" id="autoRefreshCheckbox"> Auto Refresh</div>
		<script>
				function AddCommas(str)
				{
					var parts = String(str).split('.');

					parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');

					return parts.join('.');
				}

				function Esc(value)
				{
					return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
				}

				function Num(value, digits)
				{
					var number = parseFloat(value);

					if (!isFinite(number))
						return String(value);

					return AddCommas(number.toFixed(digits));
				}

				var interval = null;
				var loading = false;

				function Digits(unit)
				{
					switch (unit)
					{
						case 'MHz':
						case 'GT/s':
						case '\u00b0C':
						case '%':
							return 1;

						case 'V':
						case 'A':
						case 'W':
						case 'KB/s':
						case 'MB/s':
							return 3;
					}

					return 0;
				}

				function YesNo(value)
				{
					return (parseFloat(value) == 0) ? 'No' : 'Yes';
				}

				function RenderHwinfo(hwinfo)
				{
					var html = '<table width="1050" style="table-layout:fixed;">';
					html += '<thead><tr><td align="left"><b>Sensor</b></td>';
					html += '<td align="right"><b>Current</b></td>';
					html += '<td align="right"><b>Minimum</b></td>';
					html += '<td align="right"><b>Maximum</b></td>';
					html += '<td align="right"><b>Average</b></td></tr></thead>';

					// Sensors are the first entries, so entryIndex == sensorIndex.
					var sensorNames = {};

					for (var j = 0; j < hwinfo.sensors.length; ++j)
						sensorNames[parseInt(hwinfo.sensors[j].entryIndex)] = hwinfo.sensors[j].sensorNameUser;

					var sensorIndex = -1;

					for (var i = 0; i < hwinfo.readings.length; ++i)
					{
						var reading = hwinfo.readings[i];

						if (sensorIndex != parseInt(reading.sensorIndex))
						{
							sensorIndex = parseInt(reading.sensorIndex);

							if (sensorNames.hasOwnProperty(sensorIndex))
								html += '<tr id="category"><td colspan="5"><b>' + Esc(sensorNames[sensorIndex]) + '</b></td></tr>';
						}

						var digits = Digits(reading.unit);
						var unit = Esc(reading.unit);

						html += '<tr><td align="left">' + Esc(reading.labelUser) + '</td>';

						if (reading.unit == 'Yes/No')
						{
							html += '<td align="right">' + YesNo(reading.value) + '</td>';
							html += '<td align="right">' + YesNo(reading.valueMin) + '</td>';
							html += '<td align="right">' + YesNo(reading.valueMax) + '</td>';
							html += '<td align="right">' + YesNo(reading.valueAvg) + '</td></tr>';
						}
						else
						{
							html += '<td align="right">' + Num(reading.value, digits) + ' ' + unit + '</td>';
							html += '<td align="right">' + Num(reading.valueMin, digits) + ' ' + unit + '</td>';
							html += '<td align="right">' + Num(reading.valueMax, digits) + ' ' + unit + '</td>';
							html += '<td align="right">' + Num(reading.valueAvg, digits) + ' ' + unit + '</td></tr>';
						}
					}

					html += '</table>';

					document.getElementById("hwinfo").innerHTML = html;
				}

				function RenderGpuz(gpuz)
				{
					var html = '<br><table width="1050" style="table-layout:fixed;">';
					html += '<tr><td align="left" width="250"><b>GPU-Z</b></td>';
					html += '<td width="350"></td><td width="150"></td><td width="150"></td><td width="150"></td></tr>';
					html += '<tr><td align="left"><b>Sensor</b></td>';
					html += '<td align="right"><b>Current</b></td><td></td><td></td><td></td></tr>';

					for (var i = 0; i < gpuz.data.length; ++i)
					{
						if ((gpuz.data[i].key.length > 0) && (gpuz.data[i].value.length > 0))
						{
							html += '<tr><td align="left">' + Esc(gpuz.data[i].key) + '</td>';
							html += '<td align="right">' + Esc(gpuz.data[i].value) + '</td><td></td><td></td><td></td></tr>';
						}
					}

					for (var i = 0; i < gpuz.sensors.length; ++i)
					{
						var unit = String(gpuz.sensors[i].unit).replace('%%', '%');
						var digits = Math.min(Math.max(parseInt(gpuz.sensors[i].digits) || 0, 0), 20);

						html += '<tr><td align="left">' + Esc(gpuz.sensors[i].name) + '</td>';
						html += '<td align="right">' + Num(gpuz.sensors[i].value, digits).replace(/,/g, '');
						html += ' ' + Esc(unit) + '</td><td></td><td></td><td></td></tr>';
					}

					html += '</table>';

					document.getElementById("gpuz").innerHTML = html;
				}

				function RenderAfterburner(afterburner)
				{
					var html = '<br><table width="1050" style="table-layout:fixed;">';
					html += '<tr><td align="left" width="250"><b>MSI Afterburner</b></td>';
					html += '<td width="350"></td><td width="150"></td><td width="150"></td><td width="150"></td></tr>';
					html += '<tr><td align="left"><b>Sensor</b></td>';
					html += '<td align="right"><b>Current</b></td>';
					html += '<td align="right"><b>Minimum Limit</b></td>';
					html += '<td align="right"><b>Maximum Limit</b></td><td></td></tr>';

					for (var i = 0; i < afterburner.entries.length; ++i)
					{
						var entry = afterburner.entries[i];
						var digits = Math.min(Math.max(parseInt(entry.digits) || 0, 0), 20);
						var unit = Esc(entry.localUnits);

						// Not available values (NaN / Infinity / FLT_MAX) are shown as 0.
						var data = parseFloat(entry.data);

						if ((!isFinite(data)) || (Math.abs(data) > 3.4e+38))
							data = 0;

						html += '<tr><td align="left">' + Esc(entry.localName) + '</td>';
						html += '<td align="right">' + data.toFixed(digits) + ' ' + unit + '</td>';
						html += '<td align="right">' + Num(entry.minLimit, digits).replace(/,/g, '') + ' ' + unit + '</td>';
						html += '<td align="right">' + Num(entry.maxLimit, digits).replace(/,/g, '') + ' ' + unit + '</td><td></td></tr>';
					}

					html += '</table>';

					document.getElementById("afterburner").innerHTML = html;
				}

				function fetchMetrics()
				{
					// Do not start a new request while the previous one is still running.
					if (loading)
						return;

					loading = true;

					var xmlHttp = new XMLHttpRequest();

					xmlHttp.open('GET', '/json.json', true);
					xmlHttp.timeout = 5000;

					xmlHttp.onreadystatechange = function()
					{
						if (this.readyState != 4)
							return;

						loading = false;

						if (this.status != 200)
							return;

						var json;

						try
						{
							json = JSON.parse(this.responseText);
						}
						catch (e)
						{
							console.error('Invalid JSON', e);

							return;
						}

						if (json.hasOwnProperty('hwinfo'))
							RenderHwinfo(json.hwinfo);

						if (json.hasOwnProperty('gpuz'))
							RenderGpuz(json.gpuz);

						if (json.hasOwnProperty('afterburner'))
							RenderAfterburner(json.afterburner);
					};

					xmlHttp.send();
				}

				fetchMetrics();

				var autoRefreshCheckbox = document.getElementById('autoRefreshCheckbox');

				autoRefreshCheckbox.addEventListener('change', function() {
					if (interval !== null)
					{
						clearInterval(interval);
						interval = null;
					}

					if (this.checked)
						interval = setInterval(fetchMetrics, 1000);
				});
		</script>
	</body>
</html>
